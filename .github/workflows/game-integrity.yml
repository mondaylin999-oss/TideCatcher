name: Game integrity

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/game-integrity.test.js
      - run: node tests/boss-moodling.test.js
      - run: node tests/jump-upgrade.test.js
      - run: node tests/game-layouts.test.js
